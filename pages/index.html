    a { display: inline-block; background: #b6cdb6; color: #182119; padding: 13px 20px; border-radius: 5px; font-weight: 650; text-decoration: none; }
    a:hover { background: #c9dcc9; }
    a:focus-visible { outline: 3px solid #e8ede9; outline-offset: 5px; }
    small { display: block; color: #89968c; margin-top: 32px; line-height: 1.6; }
