name: ASCEND CI/CD
# GitHub Pages is intentionally disabled: private source does not mean private Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ASCEND
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser app syntax
        run: node --check app.js
      - name: Test access control and shared-state storage
        run: node --test server/shared.test.mjs server/client.test.mjs
      - name: Build private hosting artifact
        run: node scripts/build-private.mjs
      - name: Test private bundle
        run: node --test server/bundle.test.mjs

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out ASCEND
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies (if needed)
        run: npm ci
      - name: Run production build script
        run: node scripts/build-private.mjs
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend-private-artifact
          path: dist/ # Adjust this directory based on where your build output goes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only run deployment automatically on push to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ascend-private-artifact
          path: dist/
      - name: Deploy to Server/Environment
        run: |
          echo "Add your deployment commands or server upload steps here (e.g., SSH, RSYNC, Docker push)"
          # Example: rsync, ssh commands, or cloud deployment action
