name: Deploy ASCEND to GitHub Pages

# Deliberately manual: Pages is normally public even for a private repository.
# Enable publication only after confirming the audience.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ascend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out ASCEND
        uses: actions/checkout@v4
      - name: Prepare ASCEND-only site
        run: |
          mkdir -p public
          cp index.html style.css app.js public/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
