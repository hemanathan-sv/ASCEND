name: ASCEND private build checks

# GitHub Pages is intentionally disabled: private source does not mean private Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ASCEND
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser app syntax
        run: node --check app.js
      - name: Test access control and shared-state storage
        run: node --test server/shared.test.mjs server/client.test.mjs
      - name: Build private hosting artifact
        run: node scripts/build-private.mjs
      - name: Test private bundle
        run: node --test server/bundle.test.mjs
